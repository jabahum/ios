host: localhost:3000
info:
  contact:
    email: support@ios.gov.ug
    name: API Support
  description: This is the API documentation for the Integrated Outbreak Surveillance
    System
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Integrated Outbreak Surveillance (IOS) API
  version: "1.0"
paths:
  /api/alerts:
    get:
      description: Retrieve list of alerts with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated alerts
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get alerts
      tags:
      - Alerts
  /api/departments:
    get:
      description: Requires admin:read
      produces:
      - application/json
      responses:
        "200":
          description: '{ \"departments\": [...] }'
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionAuth: []
      summary: List departments
      tags:
      - Departments
    post:
      consumes:
      - application/json
      description: Requires admin:create
      parameters:
      - description: Department
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.APIDepartmentWriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionAuth: []
      summary: Create department
      tags:
      - Departments
  /api/departments/{id}:
    delete:
      description: Requires admin:delete. Fails with 409 if still referenced.
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionAuth: []
      summary: Delete department
      tags:
      - Departments
    get:
      description: Requires admin:read
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: '{ \"department\": {...} }'
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionAuth: []
      summary: Get department by ID
      tags:
      - Departments
    put:
      consumes:
      - application/json
      description: Requires admin:update
      parameters:
      - description: Department ID
        in: path
        name: id
        required: true
        type: integer
      - description: Department
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.APIDepartmentWriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - SessionAuth: []
      summary: Update department
      tags:
      - Departments
  /api/employees:
    get:
      description: 'Returns `{ "employees": [...] }`. Requires `employees:read`.'
      produces:
      - application/json
      responses:
        "200":
          description: employees array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get all employees
      tags:
      - Employees
    post:
      consumes:
      - application/json
      description: Requires `employees:create`. Body field names match `models.Employee`
        JSON tags.
      parameters:
      - description: Employee
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.APIEmployeeWriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Create employee
      tags:
      - Employees
  /api/employees/{id}:
    delete:
      description: Requires `employees:delete`.
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Delete employee
      tags:
      - Employees
    get:
      description: 'Returns `{ "employee": { ... } }` with nullable fields. Requires
        `employees:read`.'
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: employee object
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get employee by ID
      tags:
      - Employees
    put:
      consumes:
      - application/json
      description: Requires `employees:update`.
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      - description: Employee
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.APIEmployeeWriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Update employee
      tags:
      - Employees
  /api/facilities:
    get:
      description: Retrieve list of health facilities
