basePath: /
definitions:
  handlers.LoginCredentials:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@ios.gov.ug
    name: API Support
  description: This is the API documentation for the Integrated Outbreak Surveillance
    System
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Integrated Outbreak Surveillance (IOS) API
  version: "1.0"
