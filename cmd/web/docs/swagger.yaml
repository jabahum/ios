basePath: /
definitions:
  handlers.APIOutbreakAssignRequest:
    properties:
      outbreak_id:
        example: 1
        type: integer
      user_id:
        example: 42
        type: integer
    type: object
  handlers.APIOutbreakCreateRequest:
    properties:
      description:
        type: string
      end_date:
        type: string
      name:
        example: Ebola response
        type: string
      outbreak_category:
        type: string
      outbreak_type:
        example: vhf
        type: string
      start_date:
        example: "2025-01-15"
        type: string
      status:
        example: active
        type: string
    type: object
  handlers.APIUserCreateRequest:
    properties:
      department_id:
        example: 1
        type: integer
      email:
        example: jdoe@example.com
        type: string
      first_name:
        example: Jane
        type: string
      is_active:
        example: true
        type: boolean
      last_name:
        example: Doe
        type: string
      password:
        example: ChangeMe123!
        type: string
      role_ids:
        example:
        - 2
        - 3
        items:
          type: integer
        type: array
      username:
        example: jdoe
        type: string
    type: object
  handlers.APIUserUpdateRequest:
    properties:
      department_id:
        type: integer
      email:
        type: string
      first_name:
        type: string
      is_active:
        type: boolean
      last_name:
        type: string
      role_ids:
        items:
          type: integer
        type: array
    type: object
  handlers.LoginCredentials:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
host: localhost:3000
info:
  contact:
    email: support@ios.gov.ug
    name: API Support
  description: This is the API documentation for the Integrated Outbreak Surveillance
    System
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  title: Integrated Outbreak Surveillance (IOS) API
  version: "1.0"
paths:
  /api/alerts:
    get:
      description: Retrieve list of alerts with pagination
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated alerts
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get alerts
      tags:
      - Alerts
  /api/employees:
    get:
      description: 'Returns `{ "employees": [...] }`. Requires `employees:read`.'
      produces:
      - application/json
      responses:
        "200":
          description: employees array
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get all employees
      tags:
      - Employees
    post:
      consumes:
      - application/json
      description: JSON body uses `models.Employee` field names (`employee_fname`,
        `facility`, …). Requires `employees:create`.
      parameters:
      - description: Employee fields (sql.Null* as string/number or null)
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Create employee
      tags:
      - Employees
  /api/employees/{id}:
    delete:
      description: Requires `employees:delete`.
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Deleted
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Delete employee
      tags:
      - Employees
    get:
      description: 'Returns `{ "employee": { ... } }` with nullable fields. Requires
        `employees:read`.'
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: employee object
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Get employee by ID
      tags:
      - Employees
    put:
      consumes:
      - application/json
      description: Requires `employees:update`.
      parameters:
      - description: Employee ID
        in: path
        name: id
        required: true
        type: integer
      - description: Employee fields
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - SessionAuth: []
      summary: Update employee
      tags:
      - Employees
