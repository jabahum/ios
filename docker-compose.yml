services:
  web:
    build: .
    env_file:
      - .env
    ports:
      - 3001:3000
    volumes:
      - .:/var/www/integrated-outbreak-system/app
    command: air cmd/web/main.go -b 0.0.0.0
  db:
    image: postgres:alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - 5433:5432
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db: