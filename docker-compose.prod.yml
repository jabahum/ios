services:
  ios-keycloak:
    env_file:
      - prod.env
    command:
      - start
      - --import-realm
      - --http-enabled=true
      - --proxy=edge
      - --hostname=${KEYCLOAK_HOSTNAME}
      - --hostname-strict=false
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    ports:
      - "8081:8080"
    restart: unless-stopped

  web:
    image: ghcr.io/${GHCR_OWNER}/${GHCR_WEB_IMAGE:-integrated-outbreak-system}:${APP_TAG:-latest}
    env_file:
      - prod.env
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-prod}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI}
      AUTH_PROVIDER: ${AUTH_PROVIDER}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      AUTH_SUCCESS_REDIRECT: ${AUTH_SUCCESS_REDIRECT}
      AUTH_LOGOUT_REDIRECT: ${AUTH_LOGOUT_REDIRECT}
      AUTH_ACCESS_TOKEN_NAME: ${AUTH_ACCESS_TOKEN_NAME}
      AUTH_REFRESH_TOKEN_NAME: ${AUTH_REFRESH_TOKEN_NAME}
      AUTH_SESSION_MAX_AGE: ${AUTH_SESSION_MAX_AGE}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      AT_API_KEY: ${AT_API_KEY}
      AT_USERNAME: ${AT_USERNAME}
      AT_PHONE: ${AT_PHONE}
    ports:
      - "3001:3000"

  db:
    env_file:
      - prod.env
    ports:
      - "5433:5432"
