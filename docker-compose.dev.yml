services:
  ios-keycloak:
    env_file:
      - dev.env
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: ${KEYCLOAK_DB:-postgres}
      KC_DB_URL_HOST: ios-keycloak-db
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_PROXY: "edge"
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-http://localhost:8081}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
    ports:
      - "8081:8080"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: integrated-outbreak-web
    env_file:
      - dev.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_BASE_URL: ${KEYCLOAK_BASE_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE}
      KEYCLOAK_REDIRECT_URI: ${KEYCLOAK_REDIRECT_URI}
      AUTH_PROVIDER: ${AUTH_PROVIDER}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN}
      AUTH_COOKIE_PATH: ${AUTH_COOKIE_PATH}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      AUTH_SUCCESS_REDIRECT: ${AUTH_SUCCESS_REDIRECT}
      AUTH_LOGOUT_REDIRECT: ${AUTH_LOGOUT_REDIRECT}
      AUTH_ACCESS_TOKEN_NAME: ${AUTH_ACCESS_TOKEN_NAME}
      AUTH_REFRESH_TOKEN_NAME: ${AUTH_REFRESH_TOKEN_NAME}
      AUTH_SESSION_MAX_AGE: ${AUTH_SESSION_MAX_AGE}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      AT_API_KEY: ${AT_API_KEY}
      AT_USERNAME: ${AT_USERNAME}
      AT_PHONE: ${AT_PHONE}
    ports:
      - "3001:3000"
    volumes:
      - .:/var/www/integrated-outbreak-system/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    command: air -c .air.toml
    networks:
      - ios_network

  db:
    ports:
      - "5435:5432"

volumes:
  go-mod-cache:
    driver: local
  go-build-cache:
    driver: local
