{{ define "content" }}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item"><a href="/inventory">Inventory</a></li>
                        <li class="breadcrumb-item active">Stock Management</li>
                    </ol>
                </div>
                <h4 class="page-title">Stock Management</h4>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="/inventory/stock/save">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="item_id" class="form-label">Item *</label>
                                    <select class="form-select" id="item_id" name="item_id" required>
                                        <option value="">Select Item</option>
                                        {{range .InventoryItems}}
                                        <option value="{{.ID}}">{{.Name}} ({{.Unit}})</option>
                                        {{end}}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="site_id" class="form-label">Treatment Site *</label>
                                    <select class="form-select" id="site_id" name="site_id" required>
                                        <option value="">Select Treatment Site</option>
                                        {{range .InventoryTreatmentSites}}
                                        <option value="{{.ID}}">{{.Name}} - {{.Location}}</option>
                                        {{end}}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="transaction_type" class="form-label">Transaction Type *</label>
                                    <select class="form-select" id="transaction_type" name="transaction_type" required>
                                        <option value="">Select Type</option>
                                        <option value="in">Stock In</option>
                                        <option value="out">Stock Out</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="quantity" class="form-label">Quantity *</label>
                                    <input type="number" step="0.01" class="form-control" id="quantity" name="quantity" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="unit_cost" class="form-label">Unit Cost</label>
                                    <input type="number" step="0.01" class="form-control" id="unit_cost" name="unit_cost">
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="reason" class="form-label">Reason *</label>
                                    <select class="form-select" id="reason" name="reason" required>
                                        <option value="">Select Reason</option>
                                        <option value="purchase">Purchase</option>
                                        <option value="donation">Donation</option>
                                        <option value="transfer">Transfer</option>
                                        <option value="usage">Usage/Consumption</option>
                                        <option value="expiry">Expiry</option>
                                        <option value="damage">Damage</option>
                                        <option value="theft">Theft</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="notes" class="form-label">Notes</label>
                                    <textarea class="form-control" id="notes" name="notes" rows="3"></textarea>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <div class="d-flex justify-content-end">
                                    <a href="/inventory" class="btn btn-secondary me-2">Cancel</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fe-save me-2"></i>Record Transaction
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Current Stock Levels -->
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h4 class="header-title mb-3">Current Stock Levels</h4>
                    <div class="table-responsive">
                        <table class="table table-centered table-nowrap table-hover mb-0">
                            <thead>
                                <tr>
                                    <th>Item</th>
                                    <th>Site</th>
                                    <th>Current Stock</th>
                                    <th>Min Stock</th>
                                    <th>Max Stock</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="6" class="text-center text-muted">
                                        <i class="fe-bar-chart-2 font-24 mb-3"></i>
                                        <h5>No stock data available</h5>
                                        <p>Stock levels will appear here after transactions are recorded.</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
