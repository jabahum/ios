{{define "content"}}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">{{ if .IsNew }}Create New Role{{ else }}Edit Role{{ end }}</h5>
                    <a href="/roles" class="btn btn-outline-primary">Back to Roles</a>
                </div>
                <div class="card-body">
                    <form method="POST" action="/roles/save">
                        <input type="hidden" name="id" value="{{ .Role.ID }}">
                        
                        <div class="mb-3">
                            <label for="name" class="form-label">Role Name *</label>
                            <input type="text" class="form-control" id="name" name="name" 
                                   value="{{ .Role.Name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Description</label>
                            <textarea class="form-control" id="description" name="description" 
                                      rows="3">{{ .Role.Description }}</textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Permissions</label>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="can_view" name="permissions[]" value="view">
                                        <label class="form-check-label" for="can_view">Can View</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="can_create" name="permissions[]" value="create">
                                        <label class="form-check-label" for="can_create">Can Create</label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="can_edit" name="permissions[]" value="edit">
                                        <label class="form-check-label" for="can_edit">Can Edit</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="can_delete" name="permissions[]" value="delete">
                                        <label class="form-check-label" for="can_delete">Can Delete</label>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-primary">
                                {{ if .IsNew }}Create Role{{ else }}Update Role{{ end }}
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
