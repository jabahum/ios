{{define "content"}}
<div class="container mt-4">
    <h2 class="mb-4">Measles Case Investigation Form</h2>
    <form method="post">
        <input type="hidden" name="patient_id" id="patient_id" value="">
        <input type="hidden" name="measles_code" id="measles_code" value="">
        <div class="alert alert-info" id="measlesCodeDisplay" style="display:none;"></div>
        <ul class="nav nav-tabs" id="measlesTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="demographics-tab" data-bs-toggle="tab" data-bs-target="#demographics" type="button" role="tab">Demographics</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="clinical-tab" data-bs-toggle="tab" data-bs-target="#clinical" type="button" role="tab">Clinical History</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="specimens-tab" data-bs-toggle="tab" data-bs-target="#specimens" type="button" role="tab">Specimens</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="investigators-tab" data-bs-toggle="tab" data-bs-target="#investigators" type="button" role="tab">Investigators</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="results-tab" data-bs-toggle="tab" data-bs-target="#results" type="button" role="tab">Results</button>
            </li>
        </ul>
        <div class="tab-content border border-top-0 p-3" id="measlesTabContent">
            <!-- Demographics Tab -->
            <div class="tab-pane fade show active" id="demographics" role="tabpanel">
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label>Name of Patient:</label>
                        <input type="text" name="patient_name" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Sex:</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sex" value="male">
                            <label class="form-check-label">Male</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="sex" value="female">
                            <label class="form-check-label">Female</label>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <label>Date of Birth:</label>
                        <input type="date" name="dob" class="form-control">
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-3">
                        <label>Age (in months):</label>
                        <input type="number" name="age_months" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>District of onset:</label>
                        <input type="text" name="onset_district" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Reporting Health Unit:</label>
                        <input type="text" name="reporting_unit" class="form-control">
                    </div>
                </div>
                <div class="mb-2">
                    <label>Home: Name of head of household where the child lives:</label>
                    <input type="text" name="head_of_household" class="form-control">
                </div>
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label>Guardian’s occupation:</label>
                        <input type="text" name="guardian_occupation" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>District/City:</label>
                        <input type="text" name="home_district" class="form-control">
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label>Sub-county/Division/Town council:</label>
                        <input type="text" name="subcounty" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>Parish/Ward:</label>
                        <input type="text" name="parish" class="form-control">
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label>LC1 (zone):</label>
                        <input type="text" name="lc1_zone" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>LC 1 Chairman’s name:</label>
                        <input type="text" name="lc1_chairman" class="form-control">
                    </div>
                </div>
                <div class="mb-2">
                    <label>L.C.T1 Tel. Contact:</label>
                    <input type="text" name="lc1_tel" class="form-control">
                </div>
            </div>
            <!-- Clinical History Tab -->
            <div class="tab-pane fade" id="clinical" role="tabpanel">
                <div class="mb-2">
                    <label>Symptoms (circle as appropriate):</label>
                    <div class="row">
                        <div class="col-md-2">
                            <label>Fever:</label>
                            <input type="checkbox" name="fever">
                        </div>
                        <div class="col-md-4">
                            <label>Date of onset:</label>
                            <input type="date" name="fever_onset" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Temperature:</label>
                            <input type="number" step="0.1" name="temperature" class="form-control">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-2">
                            <label>Rash:</label>
                            <input type="checkbox" name="rash">
                        </div>
                        <div class="col-md-4">
                            <label>Date of onset:</label>
                            <input type="date" name="rash_onset" class="form-control">
                        </div>
                        <div class="col-md-2">
                            <label>Cough:</label>
                            <input type="checkbox" name="cough">
                        </div>
                        <div class="col-md-2">
                            <label>Red eyes:</label>
                            <input type="checkbox" name="red_eyes">
                        </div>
                        <div class="col-md-2">
                            <label>Running nose:</label>
                            <input type="checkbox" name="running_nose">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-3">
                            <label>Other complications:</label>
                            <input type="checkbox" name="other_complications">
                        </div>
                        <div class="col-md-9">
                            <label>If yes, specify:</label>
                            <input type="text" name="complications_specify" class="form-control">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-4">
                            <label>Outcome:</label>
                            <select name="outcome" class="form-select">
                                <option value="1">Alive</option>
                                <option value="2">Dead</option>
                                <option value="3">Unknown</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label>Did the patient receive Vitamin A?</label>
                            <input type="checkbox" name="vitamin_a">
                        </div>
                        <div class="col-md-4">
                            <label>If yes, number of doses:</label>
                            <input type="number" name="vitamin_a_doses" class="form-control">
                        </div>
                    </div>
                    <div class="row mt-2">
                        <div class="col-md-4">
                            <label>Immunisation History:</label><br>
                            <input type="checkbox" name="immunisation_card_seen"> Card seen
                        </div>
                        <div class="col-md-4">
                            <label>Number of measles doses:</label>
                            <input type="number" name="measles_doses" class="form-control">
                        </div>
                        <div class="col-md-4">
                            <label>Date of last measles vaccination:</label>
                            <input type="date" name="last_measles_vaccination" class="form-control">
                        </div>
                    </div>
                    <div class="mb-2 mt-2">
                        <label>If vaccination status is unknown or zero dose, give reasons:</label>
                        <input type="text" name="vaccination_reason" class="form-control">
                    </div>
                    <div class="mb-2">
                        <label>Diagnosis written in the register:</label>
                        <input type="text" name="diagnosis" class="form-control">
                    </div>
                </div>
            </div>
            <!-- Specimens Tab -->
            <div class="tab-pane fade" id="specimens" role="tabpanel">
                <div class="mb-2">
                    <strong>Blood:</strong>
                    <div class="row">
                        <div class="col-md-3">
                            <label>Date of collection:</label>
                            <input type="date" name="blood_collection_date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Date sent to the lab:</label>
                            <input type="date" name="blood_sent_date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Date received:</label>
                            <input type="date" name="blood_received_date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Spec. condition:</label>
                            <input type="text" name="blood_condition" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="mb-2">
                    <strong>Urine:</strong>
                    <div class="row">
                        <div class="col-md-3">
                            <label>Date of collection:</label>
                            <input type="date" name="urine_collection_date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Date sent to the lab:</label>
                            <input type="date" name="urine_sent_date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Date received:</label>
                            <input type="date" name="urine_received_date" class="form-control">
                        </div>
                        <div class="col-md-3">
                            <label>Spec. condition:</label>
                            <input type="text" name="urine_condition" class="form-control">
                        </div>
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label>Date sent form to District:</label>
                        <input type="date" name="form_sent_date" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>Date received form at district:</label>
                        <input type="date" name="form_received_date" class="form-control">
                    </div>
                </div>
            </div>
            <!-- Investigators Tab -->
            <div class="tab-pane fade" id="investigators" role="tabpanel">
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label>Name (person filling form):</label>
                        <input type="text" name="investigator_name" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Title:</label>
                        <input type="text" name="investigator_title" class="form-control">
                    </div>
                    <div class="col-md-3">
                        <label>Date:</label>
                        <input type="date" name="investigator_date" class="form-control">
                    </div>
                </div>
            </div>
            <!-- Results Tab -->
            <div class="tab-pane fade" id="results" role="tabpanel">
                <div class="row mb-2">
                    <div class="col-md-4">
                        <label>Serology: IgM</label>
                        <input type="text" name="serology_igm" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label>Date:</label>
                        <input type="date" name="serology_date" class="form-control">
                    </div>
                    <div class="col-md-4">
                        <label>Date sent to EPI:</label>
                        <input type="date" name="serology_epi_sent_date" class="form-control">
                    </div>
                </div>
                <div class="row mb-2">
                    <div class="col-md-6">
                        <label>Virus Isolation: Urine</label>
                        <input type="text" name="virus_isolation_urine" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label>Date:</label>
                        <input type="date" name="virus_isolation_date" class="form-control">
                    </div>
                </div>
                <div class="mb-2">
                    <label>Final Classification</label>
                    <select name="final_classification" class="form-select">
                        <option value="1">Confirmed</option>
                        <option value="2">Epidemiological linkage</option>
                        <option value="3">Probable/Compatible</option>
                        <option value="4">Discarded</option>
                        <option value="5">Suspected</option>
                    </select>
                </div>
                <div class="mb-2">
                    <label>Date results sent to district:</label>
                    <input type="date" name="results_sent_date" class="form-control">
                </div>
            </div>
        </div>
        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Submit</button>
        </div>
    </form>
</div>
<script>
  function generateUUID() {
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }
  function generateMeaslesCode() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    const rand = Math.floor(1000 + Math.random() * 9000);
    return `MSLS-${yyyy}${mm}${dd}-${rand}`;
  }
  window.onload = function() {
    var pid = generateUUID();
    document.getElementById('patient_id').value = pid;
    var code = generateMeaslesCode();
    document.getElementById('measles_code').value = code;
    var codeDisplay = document.getElementById('measlesCodeDisplay');
    codeDisplay.innerHTML = `<strong>MEASLES-CODE:</strong> <span class='text-primary'>${code}</span>`;
    codeDisplay.style.display = 'block';
  };
</script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  // Facility dropdown
  const facilitySelect = document.querySelector('select[name="reporting_health_facility_name"]');
  if (facilitySelect) {
    fetch('/api/facilities')
      .then(response => response.json())
      .then(facilities => {
        facilities.forEach(facility => {
          const option = new Option(facility.facility_name, facility.facility_name);
          facilitySelect.add(option);
        });
      })
      .catch(error => console.error('Error loading facilities:', error));
  }

  // Main location dropdowns
  const districtSelect = document.getElementById('district');
  const subcountySelect = document.getElementById('subcounty');
  const parishSelect = document.getElementById('parish');
  const villageSelect = document.getElementById('village_town');

  // 'Ill' location dropdowns
  const illDistrictSelect = document.getElementById('ill_district');
  const illSubcountySelect = document.getElementById('ill_subcounty');
  const illVillageTownSelect = document.getElementById('ill_village_town');

  // Helper to reset and disable a select
  function resetSelect(select, placeholder) {
    if (!select) return;
    select.innerHTML = `<option value="">${placeholder}</option>`;
    select.disabled = true;
  }

  // Load districts for both main and ill dropdowns
  fetch('/api/locations/districts')
    .then(response => response.json())
    .then(districts => {
      if (districtSelect) {
        resetSelect(districtSelect, 'Select District');
        districts.forEach(district => {
          const option = new Option(district.name, district.name);
          option.dataset.id = district.id;
          districtSelect.add(option);
        });
        districtSelect.disabled = false;
      }
      if (illDistrictSelect) {
        resetSelect(illDistrictSelect, 'Select District');
        districts.forEach(district => {
          const option = new Option(district.name, district.name);
          option.dataset.id = district.id;
          illDistrictSelect.add(option);
        });
        illDistrictSelect.disabled = false;
      }
    })
    .catch(error => console.error('Error loading districts:', error));

  // Main: On district change, load subcounties
  if (districtSelect && subcountySelect) {
    districtSelect.addEventListener('change', function() {
      resetSelect(subcountySelect, 'Select Subcounty');
      resetSelect(parishSelect, 'Select Parish');
      resetSelect(villageSelect, 'Select Village');
      const districtName = this.value;
      if (!districtName) return;
      const selectedOption = Array.from(this.options).find(opt => opt.value === districtName);
      const districtId = selectedOption ? selectedOption.dataset.id : null;
      if (!districtId) return;
      fetch(`/api/locations/subcounties/${districtId}`)
        .then(response => response.json())
        .then(subcounties => {
          subcounties.forEach(subcounty => {
            const option = new Option(subcounty.name, subcounty.name);
            option.dataset.id = subcounty.id;
            subcountySelect.add(option);
          });
          subcountySelect.disabled = false;
        })
        .catch(error => console.error('Error loading subcounties:', error));
    });
  }

  // Main: On subcounty change, load parishes
  if (subcountySelect && parishSelect) {
    subcountySelect.addEventListener('change', function() {
      resetSelect(parishSelect, 'Select Parish');
      resetSelect(villageSelect, 'Select Village');
      const subcountyName = this.value;
      if (!subcountyName) return;
      const selectedOption = Array.from(this.options).find(opt => opt.value === subcountyName);
      const subcountyId = selectedOption ? selectedOption.dataset.id : null;
      if (!subcountyId) return;
      fetch(`/api/locations/parishes/${subcountyId}`)
        .then(response => response.json())
        .then(parishes => {
          parishes.forEach(parish => {
            const option = new Option(parish.name, parish.name);
            option.dataset.id = parish.id;
            parishSelect.add(option);
          });
          parishSelect.disabled = false;
        })
        .catch(error => console.error('Error loading parishes:', error));
    });
  }

  // Main: On parish change, load villages
  if (parishSelect && villageSelect) {
    parishSelect.addEventListener('change', function() {
      resetSelect(villageSelect, 'Select Village');
      const parishName = this.value;
      if (!parishName) return;
      const selectedOption = Array.from(this.options).find(opt => opt.value === parishName);
      const parishId = selectedOption ? selectedOption.dataset.id : null;
      if (!parishId) return;
      fetch(`/api/locations/villages/${parishId}`)
        .then(response => response.json())
        .then(villages => {
          villages.forEach(village => {
            const option = new Option(village.name, village.name);
            villageSelect.add(option);
          });
          villageSelect.disabled = false;
        })
        .catch(error => console.error('Error loading villages:', error));
    });
  }

  // Ill: On district change, load subcounties
  if (illDistrictSelect && illSubcountySelect) {
    illDistrictSelect.addEventListener('change', function() {
      resetSelect(illSubcountySelect, 'Select Subcounty');
      resetSelect(illVillageTownSelect, 'Select Village');
      const districtName = this.value;
      if (!districtName) return;
      const selectedOption = Array.from(this.options).find(opt => opt.value === districtName);
      const districtId = selectedOption ? selectedOption.dataset.id : null;
      if (!districtId) return;
      fetch(`/api/locations/subcounties/${districtId}`)
        .then(response => response.json())
        .then(subcounties => {
          subcounties.forEach(subcounty => {
            const option = new Option(subcounty.name, subcounty.name);
            option.dataset.id = subcounty.id;
            illSubcountySelect.add(option);
          });
          illSubcountySelect.disabled = false;
        })
        .catch(error => console.error('Error loading subcounties:', error));
    });
  }

  // Ill: On subcounty change, load villages (skip parish for ill fields)
  if (illSubcountySelect && illVillageTownSelect) {
    illSubcountySelect.addEventListener('change', function() {
      resetSelect(illVillageTownSelect, 'Select Village');
      const subcountyName = this.value;
      if (!subcountyName) return;
      const selectedOption = Array.from(this.options).find(opt => opt.value === subcountyName);
      const subcountyId = selectedOption ? selectedOption.dataset.id : null;
      if (!subcountyId) return;
      fetch(`/api/locations/villages/subcounty/${subcountyId}`)
        .then(response => response.json())
        .then(villages => {
          villages.forEach(village => {
            const option = new Option(village.name, village.name);
            illVillageTownSelect.add(option);
          });
          illVillageTownSelect.disabled = false;
        })
        .catch(error => console.error('Error loading villages:', error));
    });
  }
});
</script>
{{end}}
