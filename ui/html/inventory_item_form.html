{{ define "content" }}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="/">Home</a></li>
                        <li class="breadcrumb-item"><a href="/inventory">Inventory</a></li>
                        <li class="breadcrumb-item"><a href="/inventory/items">Items</a></li>
                        <li class="breadcrumb-item active">{{if .InventoryItem}}Edit{{else}}New{{end}} Item</li>
                    </ol>
                </div>
                <h4 class="page-title">{{if .InventoryItem}}Edit{{else}}Add New{{end}} Inventory Item</h4>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="/inventory/items/save">
                        {{if .InventoryItem}}
                        <input type="hidden" name="id" value="{{.InventoryItem.ID}}">
                        {{end}}
                        
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Item Name *</label>
                                    <input type="text" class="form-control" id="name" name="name" 
                                           value="{{if .InventoryItem}}{{.InventoryItem.Name}}{{end}}" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="category_id" class="form-label">Category</label>
                                    <select class="form-select" id="category_id" name="category_id">
                                        <option value="">Select Category</option>
                                        {{range .InventoryCategories}}
                                        <option value="{{.ID}}" {{if and $.InventoryItem (eq $.InventoryItem.CategoryID .ID)}}selected{{end}}>
                                            {{.Name}}
                                        </option>
                                        {{end}}
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <div class="mb-3">
                                    <label for="description" class="form-label">Description</label>
                                    <textarea class="form-control" id="description" name="description" rows="3">{{if .InventoryItem}}{{.InventoryItem.Description}}{{end}}</textarea>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="supplier_id" class="form-label">Supplier</label>
                                    <select class="form-select" id="supplier_id" name="supplier_id">
                                        <option value="">Select Supplier</option>
                                        {{range .InventorySuppliers}}
                                        <option value="{{.ID}}" {{if and $.InventoryItem (eq $.InventoryItem.SupplierID .ID)}}selected{{end}}>
                                            {{.Name}}
                                        </option>
                                        {{end}}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="unit" class="form-label">Unit *</label>
                                    <input type="text" class="form-control" id="unit" name="unit" 
                                           value="{{if .InventoryItem}}{{.InventoryItem.Unit}}{{end}}" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="unit_cost" class="form-label">Unit Cost *</label>
                                    <input type="number" step="0.01" class="form-control" id="unit_cost" name="unit_cost" 
                                           value="{{if .InventoryItem}}{{.InventoryItem.UnitCost}}{{end}}" required>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="min_stock" class="form-label">Minimum Stock Level</label>
                                    <input type="number" step="0.01" class="form-control" id="min_stock" name="min_stock" 
                                           value="{{if .InventoryItem}}{{.InventoryItem.MinStock}}{{end}}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="max_stock" class="form-label">Maximum Stock Level</label>
                                    <input type="number" step="0.01" class="form-control" id="max_stock" name="max_stock" 
                                           value="{{if .InventoryItem}}{{.InventoryItem.MaxStock}}{{end}}">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="status" class="form-label">Status</label>
                                    <select class="form-select" id="status" name="status">
                                        <option value="active" {{if and .InventoryItem (eq .InventoryItem.Status "active")}}selected{{end}}>Active</option>
                                        <option value="inactive" {{if and .InventoryItem (eq .InventoryItem.Status "inactive")}}selected{{end}}>Inactive</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <div class="d-flex justify-content-end">
                                    <a href="/inventory/items" class="btn btn-secondary me-2">Cancel</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fe-save me-2"></i>{{if .InventoryItem}}Update{{else}}Save{{end}} Item
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{{ end }}
