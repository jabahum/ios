{{define "content"}}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0">
                    <i class="fas fa-exclamation-triangle text-warning me-2"></i>
                    Health Alerts <span id="alerts-count">(0 records)</span>
                </h2>
                            <div class="d-flex gap-2">
                <div class="input-group" style="width: 300px;">
                    <input type="text" class="form-control" id="searchInput" placeholder="Search alerts...">
                    <button class="btn btn-outline-secondary" type="button" onclick="performSearch()">
                        <i class="fas fa-search"></i>
                    </button>
                </div>
                <button class="btn btn-success" onclick="loadAllAlerts()">
                    <i class="fas fa-list me-2"></i>
                    Load All
                </button>
                <button class="btn btn-primary" onclick="loadAlerts()">
                    <i class="fas fa-sync-alt me-2"></i>
                    Refresh
                </button>
            </div>
            </div>

            <!-- Filters -->
            <div class="card mb-3">
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-2">
                            <label for="severityFilter" class="form-label">Severity</label>
                            <select class="form-select" id="severityFilter" onchange="applyFilters()">
                                <option value="">All Severities</option>
                                <option value="Critical">Critical</option>
                                <option value="High">High</option>
                                <option value="Medium">Medium</option>
                                <option value="Low">Low</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="statusFilter" class="form-label">Status</label>
                            <select class="form-select" id="statusFilter" onchange="applyFilters()">
                                <option value="">All Statuses</option>
                                <option value="Alive">Alive</option>
                                <option value="Closed">Closed</option>
                                <option value="Pending">Pending</option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label for="locationFilter" class="form-label">Location</label>
                            <input type="text" class="form-control" id="locationFilter" placeholder="Location..." onchange="applyFilters()">
                        </div>
                        <div class="col-md-2">
                            <label for="pageSizeSelect" class="form-label">Page Size</label>
                            <select class="form-select" id="pageSizeSelect" onchange="changePageSize()">
                                <option value="10">10</option>
                                <option value="25">25</option>
                                <option value="50">50</option>
                                <option value="100">100</option>
                            </select>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button class="btn btn-outline-secondary me-2" onclick="clearFilters()">
                                <i class="fas fa-times me-1"></i>Clear Filters
                            </button>
                            <button class="btn btn-outline-secondary" onclick="exportData()">
                                <i class="fas fa-download me-1"></i>Export
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Loading indicator -->
            <div id="loadingIndicator" class="text-center py-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
                <p class="mt-2">Loading alerts...</p>
            </div>

            <!-- Error message -->
            <div id="errorMessage" class="alert alert-danger" style="display: none;">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="errorText"></span>
            </div>

            <!-- Tab Navigation -->
            <ul class="nav nav-tabs mb-3" id="alertsTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="table-tab" data-bs-toggle="tab" data-bs-target="#table-view" type="button" role="tab" aria-controls="table-view" aria-selected="true">
                        <i class="fas fa-table me-2"></i>Table View
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="cards-tab" data-bs-toggle="tab" data-bs-target="#cards-view" type="button" role="tab" aria-controls="cards-view" aria-selected="false">
                        <i class="fas fa-th-large me-2"></i>Card View
                    </button>
                </li>
            </ul>

            <!-- Tab Content -->
            <div class="tab-content" id="alertsTabContent">
                <!-- Table View Tab -->
                <div class="tab-pane fade show active" id="table-view" role="tabpanel" aria-labelledby="table-tab">
                    <div class="card">
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-striped table-hover mb-0" id="alertsTable">
                                    <thead class="table-dark">
                                        <tr>
                                            <th>Alert ID</th>
                                            <th>CIF Number</th>
                                            <th>Case Code</th>
                                            <th>Date</th>
                                            <th>Time</th>
                                            <th>Reporter</th>
                                            <th>Contact Number</th>
                                            <th>Source</th>
                                            <th>District</th>
                                            <th>Status</th>
                                            <th>Response</th>
                                            <th>Verified</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="alertsTableBody">
                                        <!-- Data will be loaded dynamically -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="card-footer">
                            <div class="d-flex justify-content-between align-items-center">
                                <span class="text-muted" id="paginationInfo">Showing 0 of 0 records</span>
                                <nav aria-label="Alerts pagination">
                                    <ul class="pagination pagination-sm mb-0" id="pagination">
                                        <!-- Pagination will be generated dynamically -->
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Card View Tab -->
                <div class="tab-pane fade" id="cards-view" role="tabpanel" aria-labelledby="cards-tab">
                    <div class="row" id="alerts-container">
                        <!-- Cards will be loaded dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
let currentPage = 1;
let currentPageSize = 10;
let currentSearch = '';
let currentFilters = {
    severity: '',
    status: '',
    location: ''
};
let allAlerts = [];

$(document).ready(function() {
    // Load initial data
    loadAlerts();

    // Search functionality
    $('#searchInput').on('keypress', function(e) {
        if (e.which === 13) { // Enter key
            performSearch();
        }
    });

    // Handle tab switching
    $('button[data-bs-toggle="tab"]').on('shown.bs.tab', function (e) {
        if (e.target.id === 'cards-tab') {
            renderCards();
        }
    });
});

function loadAlerts() {
    showLoading(true);
    hideError();
    
    const params = new URLSearchParams({
        page: currentPage,
        page_size: currentPageSize,
        search: currentSearch,
        severity: currentFilters.severity,
        status: currentFilters.status,
        location: currentFilters.location
    });

    fetch(`/api/alerts?${params}`)
        .then(response => {
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            if (data.success) {
                allAlerts = data.data;
                updateAlertsCount(data.total);
                renderTable();
                renderPagination(data);
                showLoading(false);
            } else {
                throw new Error(data.message || 'Failed to load alerts');
            }
        })
        .catch(error => {
            console.error('Error loading alerts:', error);
            showError('Failed to load alerts: ' + error.message);
            showLoading(false);
        });
}

function renderTable() {
    const tbody = document.getElementById('alertsTableBody');
    tbody.innerHTML = '';

    if (allAlerts.length === 0) {
        tbody.innerHTML = `
            <tr>
                <td colspan="13" class="text-center py-4">
                    <i class="fas fa-info-circle text-muted me-2"></i>
                    No alerts found matching your criteria.
                </td>
            </tr>
        `;
        return;
    }

    allAlerts.forEach(alert => {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><strong>${alert.id}</strong></td>
            <td>${alert.cif_number || '-'}</td>
            <td>${alert.case_code || '-'}</td>
            <td>${formatDateOnly(alert.created_at)}</td>
            <td>${formatTimeOnly(alert.created_at)}</td>
            <td>${alert.reporter || 'Not specified'}</td>
            <td>${alert.contact_number || '-'}</td>
            <td>
                <span class="badge bg-${getSourceColor(alert.source)}">${alert.source}</span>
            </td>
            <td>${alert.location}</td>
            <td>
                <span class="badge bg-${getStatusColor(alert.status)}">${alert.status}</span>
            </td>
            <td>
                <span class="badge bg-${getResponseColor(alert.response)}">${alert.response}</span>
            </td>
            <td>
                ${alert.verified ? 
                    '<span class="badge bg-success">Yes</span>' : 
                    '<span class="badge bg-secondary">No</span>'
                }
            </td>
            <td>
                <div class="dropdown">
                    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Actions
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" href="#" onclick="viewAlert('${alert.id}')"><i class="fas fa-eye me-2"></i>View Details</a></li>
                        <li><a class="dropdown-item" href="#" onclick="editAlert('${alert.id}')"><i class="fas fa-edit me-2"></i>Edit</a></li>
                        <li><a class="dropdown-item" href="#" onclick="verifyAlert('${alert.id}')"><i class="fas fa-check me-2"></i>Verify</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="#" onclick="deleteAlert('${alert.id}')"><i class="fas fa-trash me-2"></i>Delete</a></li>
                    </ul>
                </div>
            </td>
        `;
        tbody.appendChild(row);
    });
}

function renderCards() {
    const container = document.getElementById('alerts-container');
    container.innerHTML = '';

    if (allAlerts.length === 0) {
        container.innerHTML = `
            <div class="col-12">
                <div class="text-center py-4">
                    <i class="fas fa-info-circle text-muted me-2"></i>
                    No alerts found matching your criteria.
                </div>
            </div>
        `;
        return;
    }

    allAlerts.forEach(alert => {
        const card = document.createElement('div');
        card.className = 'col-md-6 col-lg-4 mb-4';
        card.innerHTML = `
            <div class="card h-100 border-${getSeverityColor(alert.severity)}">
                <div class="card-header bg-${getSeverityColor(alert.severity)} text-white">
                    <div class="d-flex justify-content-between align-items-center">
                        <h6 class="mb-0">
                            <i class="fas ${getSeverityIcon(alert.severity)} me-2"></i>
                            ${alert.title}
                        </h6>
                        <span class="badge bg-light text-dark">${alert.severity}</span>
                    </div>
                </div>
                <div class="card-body">
                    <p class="card-text">${alert.description}</p>
                    <div class="row mb-2">
                        <div class="col-6">
                            <small class="text-muted">
                                <i class="fas fa-map-marker-alt me-1"></i>
                                ${alert.location}
                            </small>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">
                                <i class="fas fa-tag me-1"></i>
                                ${alert.category}
                            </small>
                        </div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6">
                            <small class="text-muted">
                                <i class="fas fa-user me-1"></i>
                                ${alert.reporter || 'Not specified'}
                            </small>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">
                                <i class="fas fa-phone me-1"></i>
                                ${alert.contact_number || '-'}
                            </small>
                        </div>
                    </div>
                    <div class="row mb-2">
                        <div class="col-6">
                            <small class="text-muted">
                                <i class="fas fa-file-medical me-1"></i>
                                CIF: ${alert.cif_number || '-'}
                            </small>
                        </div>
                        <div class="col-6">
                            <small class="text-muted">
                                <i class="fas fa-barcode me-1"></i>
                                Case: ${alert.case_code || '-'}
                            </small>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-4">
                            <span class="badge bg-${getSourceColor(alert.source)}">${alert.source}</span>
                        </div>
                        <div class="col-4">
                            <span class="badge bg-${getResponseColor(alert.response)}">${alert.response}</span>
                        </div>
                        <div class="col-4">
                            ${alert.verified ? 
                                '<span class="badge bg-success">Verified</span>' : 
                                '<span class="badge bg-secondary">Unverified</span>'
                            }
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-muted">
                            <i class="fas fa-clock me-1"></i>
                            ${formatDate(alert.created_at)}
                        </small>
                        <span class="badge bg-${getStatusColor(alert.status)}">${alert.status}</span>
                    </div>
                </div>
            </div>
        `;
        container.appendChild(card);
    });
}

function renderPagination(data) {
    const pagination = document.getElementById('pagination');
    const paginationInfo = document.getElementById('paginationInfo');
    
    // Update pagination info
    const start = (data.page - 1) * data.page_size + 1;
    const end = Math.min(start + data.page_size - 1, data.total);
    paginationInfo.textContent = `Showing ${start} to ${end} of ${data.total} records`;
    
    // Generate pagination buttons
    pagination.innerHTML = '';
    
    // Previous button
    const prevLi = document.createElement('li');
    prevLi.className = `page-item ${data.page === 1 ? 'disabled' : ''}`;
    prevLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${data.page - 1})">Previous</a>`;
    pagination.appendChild(prevLi);
    
    // Page numbers
    const startPage = Math.max(1, data.page - 2);
    const endPage = Math.min(data.total_pages, data.page + 2);
    
    for (let i = startPage; i <= endPage; i++) {
        const li = document.createElement('li');
        li.className = `page-item ${i === data.page ? 'active' : ''}`;
        li.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${i})">${i}</a>`;
        pagination.appendChild(li);
    }
    
    // Next button
    const nextLi = document.createElement('li');
    nextLi.className = `page-item ${data.page === data.total_pages ? 'disabled' : ''}`;
    nextLi.innerHTML = `<a class="page-link" href="#" onclick="goToPage(${data.page + 1})">Next</a>`;
    pagination.appendChild(nextLi);
}

function goToPage(page) {
    if (page < 1) return;
    currentPage = page;
    loadAlerts();
}

function performSearch() {
    currentSearch = document.getElementById('searchInput').value;
    currentPage = 1;
    loadAlerts();
}

function applyFilters() {
    currentFilters.severity = document.getElementById('severityFilter').value;
    currentFilters.status = document.getElementById('statusFilter').value;
    currentFilters.location = document.getElementById('locationFilter').value;
    currentPage = 1;
    loadAlerts();
}

function clearFilters() {
    document.getElementById('searchInput').value = '';
    document.getElementById('severityFilter').value = '';
    document.getElementById('statusFilter').value = '';
    document.getElementById('locationFilter').value = '';
    
    currentSearch = '';
    currentFilters = { severity: '', status: '', location: '' };
    currentPage = 1;
    loadAlerts();
}

function changePageSize() {
    currentPageSize = parseInt(document.getElementById('pageSizeSelect').value);
    currentPage = 1;
    loadAlerts();
}

function updateAlertsCount(total) {
    document.getElementById('alerts-count').textContent = `(${total} records)`;
}

function showLoading(show) {
    document.getElementById('loadingIndicator').style.display = show ? 'block' : 'none';
}

function showError(message) {
    document.getElementById('errorText').textContent = message;
    document.getElementById('errorMessage').style.display = 'block';
}

function hideError() {
    document.getElementById('errorMessage').style.display = 'none';
}

// Utility functions
function formatDateOnly(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString();
}

function formatTimeOnly(dateString) {
    const date = new Date(dateString);
    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function formatDate(dateString) {
    const date = new Date(dateString);
    return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function getSourceColor(source) {
    const colors = {
        'Community': 'info',
        'Facility': 'primary',
        'Laboratory': 'warning',
        'Surveillance': 'success'
    };
    return colors[source] || 'secondary';
}

function getStatusColor(status) {
    const colors = {
        'Alive': 'success',
        'Closed': 'secondary',
        'Pending': 'warning'
    };
    return colors[status] || 'secondary';
}

function getResponseColor(response) {
    const colors = {
        'Mpox': 'warning',
        'EVD': 'danger',
        'Measles': 'info',
        'Cholera': 'primary',
        'COVID-19': 'dark',
        'Malaria': 'success',
        'Food Safety': 'info'
    };
    return colors[response] || 'secondary';
}

function getSeverityColor(severity) {
    const colors = {
        'Critical': 'danger',
        'High': 'warning',
        'Medium': 'info',
        'Low': 'success'
    };
    return colors[severity] || 'secondary';
}

function getSeverityIcon(severity) {
    const icons = {
        'Critical': 'fa-exclamation-triangle',
        'High': 'fa-exclamation-circle',
        'Medium': 'fa-info-circle',
        'Low': 'fa-check-circle'
    };
    return icons[severity] || 'fa-info-circle';
}

// Action functions
function viewAlert(id) {
    const alert = allAlerts.find(a => a.id === id);
    if (!alert) {
        alert('Alert not found');
        return;
    }
    
    const modal = new bootstrap.Modal(document.getElementById('alertDetailsModal'));
    const content = document.getElementById('alertDetailsContent');
    
    content.innerHTML = `
        <div class="row">
            <div class="col-md-6">
                <h6 class="text-primary">Basic Information</h6>
                <table class="table table-sm">
                    <tr><td><strong>Alert ID:</strong></td><td>${alert.id}</td></tr>
                    <tr><td><strong>Title:</strong></td><td>${alert.title}</td></tr>
                    <tr><td><strong>Category:</strong></td><td>${alert.category}</td></tr>
                    <tr><td><strong>Severity:</strong></td><td><span class="badge bg-${getSeverityColor(alert.severity)}">${alert.severity}</span></td></tr>
                    <tr><td><strong>Status:</strong></td><td><span class="badge bg-${getStatusColor(alert.status)}">${alert.status}</span></td></tr>
                    <tr><td><strong>Verified:</strong></td><td>${alert.verified ? '<span class="badge bg-success">Yes</span>' : '<span class="badge bg-secondary">No</span>'}</td></tr>
                </table>
            </div>
            <div class="col-md-6">
                <h6 class="text-primary">Location & Contact</h6>
                <table class="table table-sm">
                    <tr><td><strong>Location:</strong></td><td>${alert.location}</td></tr>
                    <tr><td><strong>Reporter:</strong></td><td>${alert.reporter || 'Not specified'}</td></tr>
                    <tr><td><strong>Contact:</strong></td><td>${alert.contact_number || '-'}</td></tr>
                    <tr><td><strong>Source:</strong></td><td><span class="badge bg-${getSourceColor(alert.source)}">${alert.source}</span></td></tr>
                    <tr><td><strong>Response:</strong></td><td><span class="badge bg-${getResponseColor(alert.response)}">${alert.response}</span></td></tr>
                </table>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-12">
                <h6 class="text-primary">Case Information</h6>
                <table class="table table-sm">
                    <tr><td><strong>CIF Number:</strong></td><td>${alert.cif_number || 'Not assigned'}</td></tr>
                    <tr><td><strong>Case Code:</strong></td><td>${alert.case_code || 'Not assigned'}</td></tr>
                    <tr><td><strong>Created:</strong></td><td>${formatDate(alert.created_at)}</td></tr>
                    <tr><td><strong>Updated:</strong></td><td>${formatDate(alert.updated_at)}</td></tr>
                </table>
            </div>
        </div>
        <div class="row mt-3">
            <div class="col-12">
                <h6 class="text-primary">Description</h6>
                <div class="alert alert-info">
                    ${alert.description}
                </div>
            </div>
        </div>
    `;
    
    modal.show();
}

// Auto-refresh every 5 minutes

</script>
