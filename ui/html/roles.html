{{ define "content" }}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/rbac-dashboard">
                            <i class="fas fa-tachometer-alt"></i> RBAC Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/roles">
                            <i class="fas fa-users-cog"></i> Roles
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/permissions">
                            <i class="fas fa-key"></i> Permissions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/users">
                            <i class="fas fa-user-friends"></i> Users
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Role Management</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <button type="button" class="btn btn-sm btn-primary" onclick="showCreateRoleModal()">
                        <i class="fas fa-plus"></i> Create Role
                    </button>
                </div>
            </div>

            <!-- Role Statistics -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Total Roles</h5>
                                    <h2 id="totalRoles">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-users-cog fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Active Roles</h5>
                                    <h2 id="activeRoles">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-check-circle fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-info text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Assigned Users</h5>
                                    <h2 id="assignedUsers">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-user-friends fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-warning text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Total Permissions</h5>
                                    <h2 id="totalPermissions">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-key fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Roles Table -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">System Roles</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Role Name</th>
                                    <th>Description</th>
                                    <th>Permissions</th>
                                    <th>User Count</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="rolesTableBody">
                                <tr>
                                    <td colspan="6" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Create Role Modal -->
<div class="modal fade" id="createRoleModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Role</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createRoleForm">
                    <div class="mb-3">
                        <label for="roleName" class="form-label">Role Name</label>
                        <input type="text" class="form-control" id="roleName" required>
                    </div>
                    <div class="mb-3">
                        <label for="roleDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="roleDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permissions</label>
                        <div class="permission-grid" id="permissionsGrid">
                            <!-- Permissions will be loaded here -->
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createRole()">Create Role</button>
            </div>
        </div>
    </div>
</div>

<!-- Edit Role Modal -->
<div class="modal fade" id="editRoleModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Edit Role</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="editRoleForm">
                    <input type="hidden" id="editRoleId">
                    <div class="mb-3">
                        <label for="editRoleName" class="form-label">Role Name</label>
                        <input type="text" class="form-control" id="editRoleName" required>
                    </div>
                    <div class="mb-3">
                        <label for="editRoleDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="editRoleDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Permissions</label>
                        <div class="permission-grid" id="editPermissionsGrid">
                            <!-- Permissions will be loaded here -->
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="updateRole()">Update Role</button>
            </div>
        </div>
    </div>
</div>

<style>
    .permission-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
        max-height: 400px;
        overflow-y: auto;
    }
    
    .permission-item {
        border: 1px solid #dee2e6;
        border-radius: 8px;
        padding: 15px;
        background-color: #f8f9fa;
    }
    
    .permission-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
        font-weight: 600;
        color: #495057;
    }
    
    .permission-checkboxes {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    
    .form-check {
        margin-bottom: 5px;
    }
    
    .form-check-label {
        font-size: 0.9rem;
        color: #6c757d;
    }
</style>

<script>
function refreshData() {
    loadRoleStats();
    loadRoles();
}

function loadRoleStats() {
    fetch('/api/rbac/role-stats')
        .then(response => response.json())
        .then(data => {
            document.getElementById('totalRoles').textContent = data.totalRoles || 0;
            document.getElementById('activeRoles').textContent = data.activeRoles || 0;
            document.getElementById('assignedUsers').textContent = data.assignedUsers || 0;
            document.getElementById('totalPermissions').textContent = data.totalPermissions || 0;
        })
        .catch(error => {
            console.error('Error loading role stats:', error);
        });
}

function loadRoles() {
    fetch('/api/rbac/roles')
        .then(response => response.json())
        .then(data => {
            const rolesHtml = data.roles.map(role =>
                `<tr>
                    <td><strong>${role.name}</strong></td>
                    <td>${role.description || 'No description'}</td>
                    <td>
                        ${role.permissions ? role.permissions.map(perm => 
                            `<span class="badge bg-info me-1">${perm.resource}:${perm.action}</span>`
                        ).join('') : '<span class="text-muted">No permissions</span>'}
                    </td>
                    <td>${role.userCount || 0}</td>
                    <td>
                        <span class="badge ${role.isActive ? 'bg-success' : 'bg-secondary'}">
                            ${role.isActive ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editRole(${role.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteRole(${role.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`
            ).join('');
            
            document.getElementById('rolesTableBody').innerHTML = 
                rolesHtml || '<tr><td colspan="6" class="text-center">No roles found</td></tr>';
        })
        .catch(error => {
            console.error('Error loading roles:', error);
        });
}

function showCreateRoleModal() {
    loadPermissionsForModal('permissionsGrid');
    const modal = new bootstrap.Modal(document.getElementById('createRoleModal'));
    modal.show();
}

function loadPermissionsForModal(gridId) {
    fetch('/api/rbac/permissions')
        .then(response => response.json())
        .then(data => {
            const grid = document.getElementById(gridId);
            const resourceGroups = {};
            
            data.permissions.forEach(perm => {
                if (!resourceGroups[perm.resource]) {
                    resourceGroups[perm.resource] = [];
                }
                resourceGroups[perm.resource].push(perm);
            });
            
            grid.innerHTML = Object.entries(resourceGroups).map(([resource, perms]) => `
                <div class="permission-item">
                    <div class="permission-header">
                        <span>${resource}</span>
                        <div class="form-check form-switch">
                            <input class="form-check-input select-all-permissions" type="checkbox" 
                                   data-resource="${resource}" id="select_all_${resource}_${gridId}">
                            <label class="form-check-label" for="select_all_${resource}_${gridId}">All</label>
                        </div>
                    </div>
                    <div class="permission-checkboxes">
                        ${perms.map(perm => `
                            <div class="form-check">
                                <input class="form-check-input permission-checkbox" type="checkbox" 
                                       name="permissions" value="${perm.id}" id="perm_${perm.id}_${gridId}"
                                       data-resource="${perm.resource}">
                                <label class="form-check-label" for="perm_${perm.id}_${gridId}">
                                    ${perm.action}
                                </label>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
            
            // Add event listeners for "select all" checkboxes
            document.querySelectorAll(`#${gridId} .select-all-permissions`).forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const resource = this.dataset.resource;
                    const isChecked = this.checked;
                    document.querySelectorAll(`#${gridId} .permission-checkbox[data-resource="${resource}"]`)
                        .forEach(cb => cb.checked = isChecked);
                });
            });
        })
        .catch(error => {
            console.error('Error loading permissions for modal:', error);
        });
}

function createRole() {
    const name = document.getElementById('roleName').value;
    const description = document.getElementById('roleDescription').value;
    const selectedPermissions = Array.from(document.querySelectorAll('#permissionsGrid input[name="permissions"]:checked'))
        .map(cb => parseInt(cb.value));
    
    fetch('/api/rbac/roles', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            name: name,
            description: description,
            permissions: selectedPermissions
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            bootstrap.Modal.getInstance(document.getElementById('createRoleModal')).hide();
            document.getElementById('createRoleForm').reset();
            refreshData();
        } else {
            alert('Error creating role: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error creating role:', error);
        alert('Error creating role');
    });
}

function editRole(roleId) {
    fetch(`/api/rbac/roles/${roleId}`)
        .then(response => response.json())
        .then(data => {
            document.getElementById('editRoleId').value = data.id;
            document.getElementById('editRoleName').value = data.name;
            document.getElementById('editRoleDescription').value = data.description || '';
            
            loadPermissionsForModal('editPermissionsGrid');
            
            // Set existing permissions as checked
            setTimeout(() => {
                if (data.permissions) {
                    data.permissions.forEach(perm => {
                        const checkbox = document.getElementById(`perm_${perm.id}_editPermissionsGrid`);
                        if (checkbox) {
                            checkbox.checked = true;
                        }
                    });
                }
            }, 500);
            
            const modal = new bootstrap.Modal(document.getElementById('editRoleModal'));
            modal.show();
        })
        .catch(error => {
            console.error('Error fetching role:', error);
            alert('Error fetching role data');
        });
}

function updateRole() {
    const roleId = document.getElementById('editRoleId').value;
    const name = document.getElementById('editRoleName').value;
    const description = document.getElementById('editRoleDescription').value;
    const selectedPermissions = Array.from(document.querySelectorAll('#editPermissionsGrid input[name="permissions"]:checked'))
        .map(cb => parseInt(cb.value));
    
    fetch(`/api/rbac/roles/${roleId}`, {
        method: 'PUT',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            name: name,
            description: description,
            permissions: selectedPermissions
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            bootstrap.Modal.getInstance(document.getElementById('editRoleModal')).hide();
            refreshData();
        } else {
            alert('Error updating role: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error updating role:', error);
        alert('Error updating role');
    });
}

function deleteRole(roleId) {
    if (confirm('Are you sure you want to delete this role?')) {
        fetch(`/api/rbac/roles/${roleId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                refreshData();
            } else {
                alert('Error deleting role: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error deleting role:', error);
            alert('Error deleting role');
        });
    }
}

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
    refreshData();
});
</script>
{{ end }}
