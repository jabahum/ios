{{ define "content" }}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="page-title-box">
                <div class="page-title-right">
                    <ol class="breadcrumb m-0">
                        <li class="breadcrumb-item"><a href="/home">Home</a></li>
                        <li class="breadcrumb-item"><a href="/inventory">Inventory</a></li>
                        <li class="breadcrumb-item active">Requisition</li>
                    </ol>
                </div>
                <h4 class="page-title">Create Requisition</h4>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <form method="POST" action="/inventory/requisitions/save">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="site_id" class="form-label">Treatment Site *</label>
                                    <select class="form-select" id="site_id" name="site_id" required>
                                        <option value="">Select Treatment Site</option>
                                        {{range .InventoryTreatmentSites}}
                                        <option value="{{.ID}}">{{.Name}} - {{.Location}}</option>
                                        {{end}}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="priority" class="form-label">Priority *</label>
                                    <select class="form-select" id="priority" name="priority" required>
                                        <option value="">Select Priority</option>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                        <option value="urgent">Urgent</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-12">
                                <div class="mb-3">
                                    <label for="notes" class="form-label">Requisition Notes</label>
                                    <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Enter the reason for this requisition and any special requirements"></textarea>
                                </div>
                            </div>
                        </div>

                        <!-- Requested Items Section -->
                        <div class="row">
                            <div class="col-12">
                                <h5 class="mb-3">Requested Items</h5>
                                <div id="requested-items">
                                    <div class="requested-item row mb-3">
                                        <div class="col-md-4">
                                            <label class="form-label">Item</label>
                                            <select class="form-select" name="items[]" required>
                                                <option value="">Select Item</option>
                                                {{range .InventoryItems}}
                                                <option value="{{.ID}}">{{.Name}} ({{.Unit}})</option>
                                                {{end}}
                                            </select>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Quantity Needed</label>
                                            <input type="number" class="form-control" name="quantities[]" min="1" required>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Current Stock</label>
                                            <input type="number" class="form-control" name="current_stock[]" readonly>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">Shortage</label>
                                            <input type="number" class="form-control" name="shortage[]" readonly>
                                        </div>
                                        <div class="col-md-2">
                                            <label class="form-label">&nbsp;</label>
                                            <button type="button" class="btn btn-danger btn-block" onclick="removeRequestedItem(this)">
                                                <i class="fe-trash-2"></i> Remove
                                            </button>
                                        </div>
                                    </div>
                                </div>
                                <button type="button" class="btn btn-success" onclick="addRequestedItem()">
                                    <i class="fe-plus me-2"></i>Add Item
                                </button>
                            </div>
                        </div>

                        <!-- Requisition Summary -->
                        <div class="row">
                            <div class="col-md-6 offset-md-6">
                                <div class="card">
                                    <div class="card-body">
                                        <h5 class="card-title">Requisition Summary</h5>
                                        <div class="d-flex justify-content-between mb-2">
                                            <span>Total Items:</span>
                                            <span id="total-items">0</span>
                                        </div>
                                        <div class="d-flex justify-content-between mb-2">
                                            <span>Total Quantity:</span>
                                            <span id="total-quantity">0</span>
                                        </div>
                                        <div class="d-flex justify-content-between">
                                            <span>Priority:</span>
                                            <span id="priority-display">--</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-12">
                                <div class="d-flex justify-content-end">
                                    <a href="/inventory" class="btn btn-secondary me-2">Cancel</a>
                                    <button type="submit" class="btn btn-primary">
                                        <i class="fe-save me-2"></i>Create Requisition
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function addRequestedItem() {
    const container = document.getElementById('requested-items');
    const newItem = container.children[0].cloneNode(true);
    
    // Clear the values
    newItem.querySelectorAll('input, select').forEach(input => {
        if (input.type === 'number') {
            input.value = '';
        } else if (input.tagName === 'SELECT') {
            input.selectedIndex = 0;
        }
    });
    
    container.appendChild(newItem);
}

function removeRequestedItem(button) {
    const items = document.querySelectorAll('.requested-item');
    if (items.length > 1) {
        button.closest('.requested-item').remove();
    }
}

// Update summary when priority changes
document.addEventListener('change', function(e) {
    if (e.target.id === 'priority') {
        const priority = e.target.options[e.target.selectedIndex].text;
        document.getElementById('priority-display').textContent = priority;
    }
});

// Calculate shortage when quantity needed changes
document.addEventListener('input', function(e) {
    if (e.target.name === 'quantities[]') {
        const row = e.target.closest('.requested-item');
        const quantityNeeded = parseFloat(e.target.value) || 0;
        const currentStock = parseFloat(row.querySelector('input[name="current_stock[]"]').value) || 0;
        const shortage = Math.max(0, quantityNeeded - currentStock);
        row.querySelector('input[name="shortage[]"]').value = shortage;
        
        updateRequisitionSummary();
    }
});

function updateRequisitionSummary() {
    let totalItems = 0;
    let totalQuantity = 0;
    
    document.querySelectorAll('.requested-item').forEach(item => {
        const quantity = parseFloat(item.querySelector('input[name="quantities[]"]').value) || 0;
        if (quantity > 0) {
            totalItems++;
            totalQuantity += quantity;
        }
    });
    
    document.getElementById('total-items').textContent = totalItems;
    document.getElementById('total-quantity').textContent = totalQuantity;
}
</script>
{{ end }}
