{{ define "layout" }}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            color: #333;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .main-container {
            background-color: #ffffff;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            margin: 50px auto;
            max-width: 500px;
        }
        
        .header-section {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            padding: 30px;
            border-radius: 10px 10px 0 0;
            text-align: center;
        }
        
        .form-section {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }
        
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 15px;
            transition: all 0.3s ease;
        }
        
        .form-control:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.2rem rgba(220, 53, 69, 0.25);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
            border-radius: 8px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }
        
        .password-strength {
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
            font-size: 0.9rem;
        }
        
        .strength-weak {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .strength-medium {
            background-color: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }
        
        .strength-strong {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .password-requirements {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        
        .requirement-item {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        
        .requirement-item i {
            margin-right: 8px;
            width: 16px;
        }
        
        .requirement-met {
            color: #28a745;
        }
        
        .requirement-not-met {
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <!-- Header Section -->
        <div class="header-section">
            <h1 class="mb-0">
                <i class="fas fa-key me-2"></i>Change Password
            </h1>
            <p class="mb-0 mt-2 opacity-75">Update your account password</p>
        </div>

        <!-- Form Section -->
        <div class="form-section">
            {{ if .Message }}
            <div class="alert alert-{{ if eq .MessageType "error" }}danger{{ else }}success{{ end }} alert-dismissible fade show" role="alert">
                {{ .Message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {{ end }}

            <form method="post" action="/change-password" id="passwordForm">
                <!-- Current Password -->
                <div class="form-group">
                    <label class="form-label" for="current_password">Current Password *</label>
                    <input type="password" class="form-control" id="current_password" name="current_password" required>
                </div>

                <!-- New Password -->
                <div class="form-group">
                    <label class="form-label" for="new_password">New Password *</label>
                    <input type="password" class="form-control" id="new_password" name="new_password" required>
                    <div id="passwordStrength" class="password-strength" style="display: none;"></div>
                </div>

                <!-- Confirm New Password -->
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password *</label>
                    <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                </div>

                <!-- Password Requirements -->
                <div class="password-requirements">
                    <h6 class="mb-3">Password Requirements:</h6>
                    <div class="requirement-item" id="req-length">
                        <i class="fas fa-circle requirement-not-met"></i>
                        At least 8 characters long
                    </div>
                    <div class="requirement-item" id="req-uppercase">
                        <i class="fas fa-circle requirement-not-met"></i>
                        Contains uppercase letter
                    </div>
                    <div class="requirement-item" id="req-lowercase">
                        <i class="fas fa-circle requirement-not-met"></i>
                        Contains lowercase letter
                    </div>
                    <div class="requirement-item" id="req-number">
                        <i class="fas fa-circle requirement-not-met"></i>
                        Contains number
                    </div>
                    <div class="requirement-item" id="req-special">
                        <i class="fas fa-circle requirement-not-met"></i>
                        Contains special character
                    </div>
                </div>

                <!-- Hidden Fields -->
                <input type="hidden" name="csrf_token" value="{{ .CSRFToken }}">

                <!-- Action Buttons -->
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary" id="submitBtn" disabled>
                        <i class="fas fa-save me-1"></i>Change Password
                    </button>
                    <a href="/dashboard" class="btn btn-outline-secondary">
                        <i class="fas fa-times me-1"></i>Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>

    <script src="/static/app/cdn/js/jquery-3.6.0.min.js"></script>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js"></script>

    <script>
        $(document).ready(function() {
            let passwordValid = false;
            let confirmValid = false;

            // Check password strength and requirements
            $('#new_password').on('input', function() {
                const password = $(this).val();
                checkPasswordStrength(password);
                checkPasswordRequirements(password);
                validateForm();
            });

            // Check password confirmation
            $('#confirm_password').on('input', function() {
                const password = $('#new_password').val();
                const confirmPassword = $(this).val();
                
                if (confirmPassword === password && password.length > 0) {
                    $(this).removeClass('is-invalid').addClass('is-valid');
                    confirmValid = true;
                } else {
                    $(this).removeClass('is-valid').addClass('is-invalid');
                    confirmValid = false;
                }
                
                validateForm();
            });

            // Form submission
            $('#passwordForm').on('submit', function(e) {
                if (!validateForm()) {
                    e.preventDefault();
                    alert('Please ensure all requirements are met.');
                }
            });
        });

        function checkPasswordStrength(password) {
            const strengthDiv = $('#passwordStrength');
            
            if (password.length === 0) {
                strengthDiv.hide();
                return;
            }

            let strength = 0;
            let strengthText = '';
            let strengthClass = '';

            // Length check
            if (password.length >= 8) strength += 1;
            if (password.length >= 12) strength += 1;

            // Character type checks
            if (/[A-Z]/.test(password)) strength += 1;
            if (/[a-z]/.test(password)) strength += 1;
            if (/[0-9]/.test(password)) strength += 1;
            if (/[^A-Za-z0-9]/.test(password)) strength += 1;

            // Determine strength level
            if (strength < 3) {
                strengthText = 'Weak';
                strengthClass = 'strength-weak';
            } else if (strength < 5) {
                strengthText = 'Medium';
                strengthClass = 'strength-medium';
            } else {
                strengthText = 'Strong';
                strengthClass = 'strength-strong';
            }

            strengthDiv.html(`Password Strength: <strong>${strengthText}</strong>`)
                      .removeClass('strength-weak strength-medium strength-strong')
                      .addClass(strengthClass)
                      .show();

            passwordValid = strength >= 3;
        }

        function checkPasswordRequirements(password) {
            const requirements = {
                'req-length': password.length >= 8,
                'req-uppercase': /[A-Z]/.test(password),
                'req-lowercase': /[a-z]/.test(password),
                'req-number': /[0-9]/.test(password),
                'req-special': /[^A-Za-z0-9]/.test(password)
            };

            Object.keys(requirements).forEach(reqId => {
                const reqElement = $(`#${reqId}`);
                const icon = reqElement.find('i');
                
                if (requirements[reqId]) {
                    reqElement.removeClass('requirement-not-met').addClass('requirement-met');
                    icon.removeClass('fa-circle requirement-not-met').addClass('fa-check requirement-met');
                } else {
                    reqElement.removeClass('requirement-met').addClass('requirement-not-met');
                    icon.removeClass('fa-check requirement-met').addClass('fa-circle requirement-not-met');
                }
            });
        }

        function validateForm() {
            const currentPassword = $('#current_password').val().trim();
            const submitBtn = $('#submitBtn');
            
            if (currentPassword && passwordValid && confirmValid) {
                submitBtn.prop('disabled', false);
            } else {
                submitBtn.prop('disabled', true);
            }
        }
    </script>
</body>
</html>

{{ end }}
