{{define "content"}}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Outbreak Assignments</h5>
                    <a href="/outbreaks/assign" class="btn btn-primary">Assign Users to Outbreak</a>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <h6>Manage Outbreak Assignments</h6>
                        <p class="mb-0">Assign users to specific outbreaks and manage their access permissions.</p>
                    </div>

                    <div class="row">
                        <div class="col-md-12">
                            <div class="card">
                                <div class="card-header">
                                    <h6>Current Outbreak Assignments</h6>
                                </div>
                                <div class="card-body">
                                    <p class="text-muted">No outbreak assignments found. Click "Assign Users to Outbreak" to get started.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{{end}}
