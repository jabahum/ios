{{ define "content" }}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block bg-light sidebar">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link" href="/rbac-dashboard">
                            <i class="fas fa-tachometer-alt"></i> RBAC Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/roles">
                            <i class="fas fa-users-cog"></i> Roles
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/permissions">
                            <i class="fas fa-key"></i> Permissions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/users">
                            <i class="fas fa-user-friends"></i> Users
                        </a>
                    </li>
                </ul>
            </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Permission Management</h1>
                <div class="btn-toolbar mb-2 mb-md-0">
                    <div class="btn-group me-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i> Refresh
                        </button>
                    </div>
                    <button type="button" class="btn btn-sm btn-primary" onclick="showCreatePermissionModal()">
                        <i class="fas fa-plus"></i> Create Permission
                    </button>
                </div>
            </div>

            <!-- Permission Statistics -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card bg-primary text-white permission-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Total Permissions</h5>
                                    <h2 id="totalPermissions">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-key fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white permission-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Active Permissions</h5>
                                    <h2 id="activePermissions">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-check-circle fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-info text-white permission-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Resources</h5>
                                    <h2 id="totalResources">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-database fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-warning text-white permission-card">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h5 class="card-title">Actions</h5>
                                    <h2 id="totalActions">-</h2>
                                </div>
                                <div class="align-self-center">
                                    <i class="fas fa-cogs fa-2x"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Permissions Table -->
            <div class="card">
                <div class="card-header">
                    <h5 class="mb-0">System Permissions</h5>
                </div>
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped">
                            <thead>
                                <tr>
                                    <th>Resource</th>
                                    <th>Action</th>
                                    <th>Description</th>
                                    <th>Role Count</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="permissionsTableBody">
                                <tr>
                                    <td colspan="6" class="text-center">Loading...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<!-- Create Permission Modal -->
<div class="modal fade" id="createPermissionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create New Permission</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createPermissionForm">
                    <div class="mb-3">
                        <label for="permissionResource" class="form-label">Resource</label>
                        <input type="text" class="form-control" id="permissionResource" required>
                    </div>
                    <div class="mb-3">
                        <label for="permissionAction" class="form-label">Action</label>
                        <select class="form-control" id="permissionAction" required>
                            <option value="">Select Action</option>
                            <option value="create">Create</option>
                            <option value="read">Read</option>
                            <option value="update">Update</option>
                            <option value="delete">Delete</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="permissionDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="permissionDescription" rows="3"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="createPermission()">Create Permission</button>
            </div>
        </div>
    </div>
</div>

<style>
    .permission-card {
        transition: transform 0.2s;
    }
    .permission-card:hover {
        transform: translateY(-2px);
    }
</style>

<script>
function refreshData() {
    loadPermissionStats();
    loadPermissions();
}

function loadPermissionStats() {
    fetch('/api/rbac/permission-stats')
        .then(response => response.json())
        .then(data => {
            document.getElementById('totalPermissions').textContent = data.totalPermissions || 0;
            document.getElementById('activePermissions').textContent = data.activePermissions || 0;
            document.getElementById('totalResources').textContent = data.totalResources || 0;
            document.getElementById('totalActions').textContent = data.totalActions || 0;
        })
        .catch(error => {
            console.error('Error loading permission stats:', error);
        });
}

function loadPermissions() {
    fetch('/api/rbac/permissions')
        .then(response => response.json())
        .then(data => {
            const permissionsHtml = data.permissions.map(permission =>
                `<tr>
                    <td>${permission.resource}</td>
                    <td>${permission.action}</td>
                    <td>${permission.description || 'No description'}</td>
                    <td>${permission.roleCount || 0}</td>
                    <td>
                        <span class="badge ${permission.isActive ? 'bg-success' : 'bg-secondary'}">
                            ${permission.isActive ? 'Active' : 'Inactive'}
                        </span>
                    </td>
                    <td>
                        <button class="btn btn-sm btn-outline-primary" onclick="editPermission(${permission.id})">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletePermission(${permission.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>`
            ).join('');
            
            document.getElementById('permissionsTableBody').innerHTML = 
                permissionsHtml || '<tr><td colspan="6" class="text-center">No permissions found</td></tr>';
        })
        .catch(error => {
            console.error('Error loading permissions:', error);
        });
}

function showCreatePermissionModal() {
    const modal = new bootstrap.Modal(document.getElementById('createPermissionModal'));
    modal.show();
}

function createPermission() {
    const resource = document.getElementById('permissionResource').value;
    const action = document.getElementById('permissionAction').value;
    const description = document.getElementById('permissionDescription').value;
    
    fetch('/api/rbac/permissions', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
        },
        body: JSON.stringify({
            resource: resource,
            action: action,
            description: description
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            bootstrap.Modal.getInstance(document.getElementById('createPermissionModal')).hide();
            document.getElementById('createPermissionForm').reset();
            refreshData();
        } else {
            alert('Error creating permission: ' + data.message);
        }
    })
    .catch(error => {
        console.error('Error creating permission:', error);
        alert('Error creating permission');
    });
}

function editPermission(permissionId) {
    // Implementation for editing permission
    alert('Edit permission functionality to be implemented');
}

function deletePermission(permissionId) {
    if (confirm('Are you sure you want to delete this permission?')) {
        fetch(`/api/rbac/permissions/${permissionId}`, {
            method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                refreshData();
            } else {
                alert('Error deleting permission: ' + data.message);
            }
        })
        .catch(error => {
            console.error('Error deleting permission:', error);
            alert('Error deleting permission');
        });
    }
}

// Initialize page
document.addEventListener('DOMContentLoaded', function() {
    refreshData();
});
</script>
{{ end }}
