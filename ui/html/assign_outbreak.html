{{define "content"}}
<div class="container mt-4">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Assign Users to Outbreak</h5>
                    <a href="/outbreaks/assignments" class="btn btn-outline-primary">Back to Assignments</a>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <h6>Assign Users to Outbreak</h6>
                        <p class="mb-0">Select users to assign to specific outbreaks for case management.</p>
                    </div>

                    <form method="POST" action="/outbreaks/assign">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="outbreak_id" class="form-label">Select Outbreak</label>
                                    <select class="form-select" id="outbreak_id" name="outbreak_id" required>
                                        <option value="">Choose an outbreak...</option>
                                        {{range .Outbreaks}}
                                        <option value="{{.ID}}">{{.Name}}</option>
                                        {{end}}
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="user_id" class="form-label">Select User</label>
                                    <select class="form-select" id="user_id" name="user_id" required>
                                        <option value="">Choose a user...</option>
                                        {{range .Users}}
                                        <option value="{{.UserID}}">{{.UserName}}</option>
                                        {{end}}
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <button type="submit" class="btn btn-primary">Assign User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Load outbreaks and users if not provided in template data
document.addEventListener('DOMContentLoaded', function() {
    // Load outbreaks
    fetch('/api/outbreaks')
        .then(response => {
            console.log('Outbreaks response status:', response.status); // Debug response status
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('Outbreaks data:', data); // Debug log
            const outbreakSelect = document.getElementById('outbreak_id');
            if (data && data.length > 0) {
                data.forEach(outbreak => {
                    const option = document.createElement('option');
                    option.value = outbreak.id;
                    // Handle null name values
                    const name = outbreak.name && outbreak.name.Valid ? outbreak.name.String : `Outbreak ${outbreak.id}`;
                    option.textContent = name;
                    outbreakSelect.appendChild(option);
                });
            } else {
                console.log('No outbreaks found in data');
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No outbreaks available';
                outbreakSelect.appendChild(option);
            }
        })
        .catch(error => {
            console.error('Error loading outbreaks:', error);
            const outbreakSelect = document.getElementById('outbreak_id');
            const option = document.createElement('option');
            option.value = '';
            option.textContent = 'Error loading outbreaks';
            outbreakSelect.appendChild(option);
        });

    // Load users
    fetch('/api/users')
        .then(response => {
            console.log('Users response status:', response.status); // Debug response status
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return response.json();
        })
        .then(data => {
            console.log('Users data:', data); // Debug log
            const userSelect = document.getElementById('user_id');
            
            // Handle nested structure: {users: Array(39)}
            const users = data.users || data;
            
            if (users && users.length > 0) {
                users.forEach(user => {
                    const option = document.createElement('option');
                    option.value = user.id; // Changed from user.user_id to user.id
                    // Handle the actual API response format
                    let name = `User ${user.id}`;
                    if (user.first_name && user.last_name) {
                        name = `${user.first_name} ${user.last_name}`;
                    } else if (user.first_name) {
                        name = user.first_name;
                    } else if (user.username) { // Changed from user.user_name to user.username
                        name = user.username;
                    } else if (user.email) {
                        name = user.email;
                    }
                    option.textContent = name;
                    userSelect.appendChild(option);
                });
            } else {
                console.log('No users found in data');
                const option = document.createElement('option');
                option.value = '';
                option.textContent = 'No users available';
                userSelect.appendChild(option);
            }
        })
        .catch(error => {
            console.error('Error loading users:', error);
            const userSelect = document.getElementById('user_id');
            const option = document.createElement('option');
            option.value = '';
            option.textContent = 'Error loading users';
            userSelect.appendChild(option);
        });
});
</script>
{{end}}
